<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="240" height="90" fill="none">
    <defs>
        <linearGradient id="badgeGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F59E0B"/>
            <stop offset="1" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="textGrad" x1="85" y1="20" x2="220" y2="70" gradientUnits="userSpaceOnUse">
            <stop stop-color="#1E293B"/>
            <stop offset="1" stop-color="#334155"/>
        </linearGradient>
    </defs>

    <!-- Left Emblem Badge (Building / Shield Icon) -->
    <rect x="10" y="10" width="70" height="70" rx="20" fill="#FEF3C7" stroke="#FBBF24" stroke-width="2"/>
    
    <!-- Central Building Silhouette -->
    <rect x="33" y="27" width="16" height="36" rx="2.5" fill="url(#badgeGrad)"/>
    <rect x="22" y="37" width="10" height="26" rx="2" fill="#475569"/>
    <rect x="49" y="32" width="10" height="31" rx="2" fill="#64748B"/>
    
    <!-- Window Dots -->
    <circle cx="41" cy="34" r="1.5" fill="#FFFFFF"/>
    <circle cx="41" cy="41" r="1.5" fill="#FFFFFF"/>
    <circle cx="41" cy="48" r="1.5" fill="#FFFFFF"/>
    
    <!-- Right Placeholder Logo Brand Lines -->
    <rect x="95" y="27" width="125" height="16" rx="5" fill="url(#textGrad)"/>
    <rect x="95" y="50" width="85" height="10" rx="4" fill="#94A3B8"/>
</svg>
